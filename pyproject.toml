[project]
name = "context-vault"
version = "0.1.0"
description = "Local-first intelligent memory assistant: knowledge, projects, architecture, people, meetings, agenda and tasks on Git + Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
context-vault = "context_vault.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_vault"]

# The canonical skill ships inside the wheel so `context-vault install-skill` works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills/context-vault" = "context_vault/_skill/context-vault"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
